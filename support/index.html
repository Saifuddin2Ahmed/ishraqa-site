<style>
:root{--night:#2A1B5E;--plum:#8E3A8C;--sun:#F07A4A;--ink:#2A1B5E;--muted:#5E5770;--card:#FFFFFF}
@media (prefers-color-scheme:dark){:root{--ink:#F3EEFB;--muted:#B8B0C9;--card:#1E1830}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Cairo,Tahoma,sans-serif;background:linear-gradient(160deg,var(--night) 0%,var(--plum) 60%,var(--sun) 100%);color:var(--ink);line-height:1.8;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:440px;background:var(--card);border-radius:28px;padding:36px 24px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.logo{width:72px;height:72px;border-radius:20px}
h1{font-size:24px;line-height:1.5;margin:14px 0 8px;font-weight:800}
p{color:var(--muted);margin:0 0 22px;font-size:16px}
.stores{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px}
a.play{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:18px;background:#000;color:#fff}
a.play svg{width:30px;height:30px}
</style>
<link rel="stylesheet" href="/fx.css">
</head>
<body>
<main class="card">
  <img class="logo" src="/img/icon-192.png" alt="" width="72" height="72">
  <h1>ادعم إشراقة</h1>
  <p>دعمك يُبقي إشراقة مساحة هادئة بلا إعلانات، ويساعدها على أن تكبر وتصل إلى أناس أكثر. افتح صفحة الدعم من داخل التطبيق.</p>
  <div class="stores"><a class="play ic-only" href="https://play.google.com/store/apps/details?id=com.taeziz.ishraqa&referrer=utm_source%3Dsupport_page" aria-label="Google Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M3.6 1.8 13.3 12l-9.7 10.2c-.4-.2-.6-.6-.6-1.1V2.9c0-.5.2-.9.6-1.1zm10.8 11.3 2.6 2.7-11.4 6.5 8.8-9.2zm3.9-3.8 3 1.7c.8.5.8 1.6 0 2.1l-3 1.7-2.9-3 2.9-2.5zM5.6 1.7l11.4 6.5-2.6 2.7-8.8-9.2z"/></svg></a></div>
</main>
<script src="/platforms.js" defer></script>
