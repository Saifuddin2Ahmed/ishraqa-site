<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;src:url('../assets/fonts/Cairo-Bold.ttf');font-weight:700}
@font-face{font-family:Cairo;src:url('../assets/fonts/Cairo-SemiBold.ttf');font-weight:600}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:Cairo;background:linear-gradient(135deg,#2A1B5E 0%,#8E3A8C 55%,#F07A4A 100%);color:#fff;display:flex;align-items:center;padding:0 80px;box-sizing:border-box;gap:60px}
.t{flex:1}
.logo{display:flex;align-items:center;gap:18px;margin-bottom:26px}
.logo img{width:92px;height:92px;border-radius:24px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.logo b{font-size:46px}
h1{font-size:64px;line-height:1.3;margin:0 0 16px;font-weight:700}
p{font-size:30px;margin:0;color:#FFD27A;font-weight:600}
.pill{display:inline-block;margin-top:30px;background:rgba(255,255,255,.18);padding:10px 26px;border-radius:40px;font-size:24px;font-weight:600}
.ph{width:300px;height:540px;border-radius:40px;border:8px solid rgba(255,255,255,.25);overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.4);flex-shrink:0}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
</style></head><body>
<div class="t">
  <div class="logo"><img src="img/icon-512.png"><b>إشراقة يومية</b></div>
  <h1>دقيقة كل صباح<br>تُضيء يومك</h1>
  <p>حكمة تُلهمك · مقال يستحق وقتك · كتب ومنح</p>
  <div class="pill">مجاني وبلا إعلانات · على Google Play</div>
</div>
<div class="ph"><img src="img/swipe.webp"></div>
</body></html>
