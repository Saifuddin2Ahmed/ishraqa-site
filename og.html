<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:Cairo;src:url('../assets/fonts/Cairo-Bold.ttf');font-weight:700}
@font-face{font-family:Cairo;src:url('../assets/fonts/Cairo-SemiBold.ttf');font-weight:600}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:Cairo;background:linear-gradient(135deg,#2A1B5E 0%,#8E3A8C 55%,#F07A4A 100%);color:#fff;display:flex;align-items:center;padding:0 70px 0 40px;box-sizing:border-box;gap:30px;position:relative}
.t{flex:1;z-index:2}
.logo{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.logo img{width:66px;height:66px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.logo b{font-size:34px}
h1{font-size:66px;line-height:1.2;margin:0 0 14px;font-weight:700}
.hook{font-size:25px;margin:0 0 10px;opacity:.95;font-weight:600}
ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
li{font-size:26px;font-weight:700;color:#FFD27A}
li span{display:inline-block;width:40px}
.pill{display:inline-block;margin-top:20px;background:rgba(255,255,255,.18);padding:8px 24px;border-radius:40px;font-size:22px;font-weight:600}
.phones{position:relative;width:440px;height:630px;flex-shrink:0}
.ph{position:absolute;width:250px;height:530px;border-radius:36px;border:7px solid rgba(255,255,255,.28);overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.45);background:#fff}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.ph.back{left:0;top:70px;transform:rotate(-6deg);opacity:.95}
.ph.front{left:170px;top:40px;transform:rotate(4deg)}
</style></head><body>
<div class="phones">
  <div class="ph back"><img src="img/article.webp"></div>
  <div class="ph front"><img src="img/opps.webp"></div>
</div>
<div class="t">
  <div class="logo"><img src="img/icon-512.png"><b>إشراقة يومية</b></div>
  <h1>صباحك أذكى<br>في دقيقة</h1>
  <p class="hook">بدل التمرير بلا فائدة:</p>
  <ul>
    <li><span>🎓</span>منح دراسية حقيقية</li>
    <li><span>📰</span>مقال يفتح ذهنك</li>
    <li><span>✨</span>فكرة تُلهمك كل صباح</li>
  </ul>
  <div class="pill">مجاني وبلا إعلانات · على Google Play</div>
</div>
</body></html>
