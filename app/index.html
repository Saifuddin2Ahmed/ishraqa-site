<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- يُستبدل بقيمة --base-href عند البناء (للنشر: /app/) -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <title>إشراقة يومية</title>
  <meta name="description" content="إشراقة يومية: حكمة كل صباح، ومقال يفتح ذهنك، وكتب مجانية، ومجتمع قرّاء يتبادلون الأثر. مجاني وبلا إعلانات.">
  <meta name="theme-color" content="#4B2E83">
  <meta name="color-scheme" content="dark light">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="إشراقة يومية">
  <meta property="og:description" content="حكمة كل صباح، ومقال يفتح ذهنك، وكتب مجانية، ومجتمع قرّاء.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:locale" content="ar_AR">

  <!-- «أضف إلى الشاشة الرئيسية» على آيفون وأندرويد -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="إشراقة">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #2A1B5E;
    }
    /* شاشة البداية حتى يرسم التطبيق أول إطار: فجر متدرج والشمس تشرق */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      background: linear-gradient(180deg, #2A1B5E 0%, #4B2E83 38%, #8E3B8A 66%, #D7656A 86%, #EE7B4A 100%);
      font-family: "Segoe UI", Tahoma, "Geeza Pro", "Noto Naskh Arabic", system-ui, sans-serif;
      color: #FFF6E5;
      transition: opacity .45s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .sun {
      width: 156px;
      height: 106px;
      animation: rise 1.6s cubic-bezier(.2, .7, .2, 1) both, glow 2.8s ease-in-out 1.6s infinite;
    }
    #splash .horizon {
      width: 190px;
      height: 3px;
      margin-top: -22px;
      border-radius: 3px;
      background: rgba(255, 246, 229, .85);
    }
    #splash .name { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
    #splash .dots { display: flex; gap: 7px; }
    #splash .dots i {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255, 246, 229, .75);
      animation: pulse 1.2s ease-in-out infinite;
    }
    #splash .dots i:nth-child(2) { animation-delay: .2s; }
    #splash .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes rise { from { transform: translateY(26px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes glow { 50% { filter: drop-shadow(0 0 18px rgba(255, 209, 120, .55)); } }
    @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
    @media (prefers-reduced-motion: reduce) {
      #splash .sun, #splash .dots i { animation: none; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="إشراقة يومية، جارٍ التحميل">
    <img class="sun" src="icons/splash-sun.png" alt="">
    <div class="horizon"></div>
    <div class="name">إشراقة يومية</div>
    <div class="dots"><i></i><i></i><i></i></div>
  </div>
  <noscript>
    <p style="color:#fff;text-align:center;font-family:sans-serif;padding:24px">
      إشراقة يومية تحتاج تفعيل JavaScript في المتصفح.
    </p>
  </noscript>
  <script>
    // نخفي شاشة البداية بعد أول إطار يرسمه التطبيق
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 500);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
