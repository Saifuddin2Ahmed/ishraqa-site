<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  try {
    var q = new URLSearchParams(location.search);
    var langs = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || '']).join(',');
    if (q.get('lang') !== 'ar' && !/(^|,)ar\b/i.test(langs)) location.replace('/en/i/' + location.search + location.hash);
  } catch (e) {}
</script>
<title>دعوة إلى إشراقة يومية</title>
<meta name="description" content="منحٌ وفرص تُنشر أولًا بأول، نوادٍ للمطوّرين والمبدعين، مقالات تفتح الذهن، وصوتك في «صدى». ابدأ من هنا.">

<meta property="og:description" content="منحٌ وفرص تُنشر أولًا بأول، نوادٍ للمطوّرين والمبدعين، مقالات تفتح الذهن، وصوتك في «صدى». ابدأ من هنا.">

<meta name="twitter:image" content="https://ishraqa.app/img/og.jpg">
<meta name="twitter:image:alt" content="مساحة عمل هادئة تطل على مدينة عند الغروب">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#2A1B5E;--plum:#8E3A8C;--sun:#F07A4A;--gold:#FFB547;--cream:#FFFBF8;--ink:#2A1B5E;--muted:#5E5770;--card:#FFFFFF;--line:#EEE7F6;--chip:#F6EEF8;--ic:#8E3A8C}
@media (prefers-color-scheme:dark){:root{--cream:#14101F;--ink:#F3EEFB;--muted:#B8B0C9;--card:#1E1830;--line:#2E2645;--chip:#2B2140;--ic:#FFB547}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:Cairo,system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;background:linear-gradient(160deg,var(--night) 0%,var(--plum) 60%,var(--sun) 100%);color:#fff;line-height:1.8;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:440px;background:var(--card);color:var(--ink);border-radius:28px;padding:32px 24px 26px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.35);animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.logo{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 26px rgba(42,27,94,.25)}
.from{margin:18px 0 0;font-size:15px;color:var(--muted)}
.from b{color:var(--ink)}
h1{font-size:26px;line-height:1.5;margin:6px 0 8px;font-weight:800;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 20px;text-wrap:balance}
ul{list-style:none;padding:0;margin:0 0 26px;text-align:start}
li{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;font-weight:600;text-wrap:pretty;animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(180ms + var(--i)*80ms)}
li:last-child{border:0}
.ic{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--chip)}
.ic svg{width:20px;height:20px;fill:none;stroke:var(--ic);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stores{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:0;margin:0}
.stores a{display:block;line-height:0;border-radius:10px;animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(560ms + var(--i)*70ms);transition:transform .2s cubic-bezier(.2,.7,.2,1);-webkit-tap-highlight-color:transparent}
.stores a[hidden]{display:none}
.stores a:active{transform:scale(.96)}
.stores a:focus-visible{outline:2px solid var(--ic);outline-offset:2px}
.stores img{display:block;height:auto}
/* Google Play PNG carries its own clear space (41 of 250 px each side); visible badge = 42px */
.stores .gp img{width:162px}
/* App Store badge: 42px tall, clear space = 1/4 of its height */
.stores .as{margin:10px}.stores .as img{width:126px}
.more{display:inline-block;margin-top:20px;font-size:14px;color:var(--plum);font-weight:700;text-decoration:none}
@media (prefers-color-scheme:dark){.more{color:var(--gold)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.card,li,.stores a{animation:none}.stores a{transition:none}}
</style>
<link rel="stylesheet" href="/fx.css">
</head>
<body>
<main class="card">
  <img class="logo" src="../img/icon-192.png" alt="إشراقة يومية" width="84" height="84">
  <p class="from" id="from" hidden><b id="name"></b> يدعوك</p>
  <h1>مكانك الذي كنت تبحث عنه</h1>
  <p class="lead">فرص ومعرفة ومجتمع بلا حدود.</p>
  <ul>
    <li style="--i:0"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.42 10.92a1 1 0 0 0-.02-1.84L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.83l8.57 3.91a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg></span>منح وفرص تُنشر أولًا بأول</li>
    <li style="--i:1"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></span>نوادٍ للمطوّرين والمبدعين</li>
    <li style="--i:2"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></span>مقالات تفتح الذهن، بلغتين</li>
    <li style="--i:3"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 10v3"/><path d="M6 6v11"/><path d="M10 3v18"/><path d="M14 8v7"/><path d="M18 5v13"/><path d="M22 10v3"/></svg></span>صوتك يُسمع في «صدى»</li>
  </ul>
  <nav class="stores" aria-label="حمّل إشراقة">
    <a id="play" class="gp" style="--i:0" href="https://play.google.com/store/apps/details?id=com.taeziz.ishraqa&amp;referrer=utm_source%3Dinvite%26utm_medium%3Dapp" title="Google Play" aria-label="Google Play"><img src="/img/badges/google-play-ar.png" alt="احصل عليه من Google Play" width="162" height="63"></a>
    <a id="apple" class="as" style="--i:1" href="/app/" title="App Store" aria-label="App Store"><picture><source media="(prefers-color-scheme: dark)" srcset="/img/badges/app-store-ar-white.svg"><img src="/img/badges/app-store-ar-black.svg" alt="تنزيل من App Store" width="126" height="42"></picture></a>
  </nav>
  <a class="more" href="../">تعرّف على إشراقة ←</a>
</main>
<script>
  // اسم الداعي من الرابط (?n=) يُعرض نصًّا فقط
  try {
    var n = new URLSearchParams(location.search).get('n');
    if (n) {
      n = n.trim().slice(0, 40);
      if (n) {
        document.getElementById('name').textContent = n;
        document.getElementById('from').hidden = false;
        document.title = '' + n + ' يدعوك إلى إشراقة يومية';
      }
    }
  } catch (e) {}
  // على آيفون/آيباد: زر Apple وحده
  try {
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))
      document.getElementById('play').hidden = true;
  } catch (e) {}
</script>
<script src="/fx.js" defer></script>
</body>
</html>
