<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دعوة إلى إشراقة يومية</title>
<meta name="description" content="صديقك يدعوك إلى إشراقة — بوتقةٌ للمعرفة، وفضاءٌ للقراءة، وأفقٌ يمتد من ذاكرة الماضي إلى احتمالات المستقبل.">
<meta name="theme-color" content="#2A1B5E">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../img/icon-192.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="إشراقة يومية">
<meta property="og:locale" content="ar_AR">
<meta property="og:url" content="https://ishraqa.otwox.com/i/">
<meta property="og:title" content="لديك دعوة إلى مجتمع إشراقة 🌅">
<meta property="og:description" content="صديقك يدعوك إلى إشراقة — بوتقةٌ للمعرفة، وفضاءٌ للقراءة، وأفقٌ يمتد من ذاكرة الماضي إلى احتمالات المستقبل.">
<meta property="og:image" content="https://ishraqa.otwox.com/img/og.jpg">
<meta property="og:image:secure_url" content="https://ishraqa.otwox.com/img/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ishraqa.otwox.com/img/og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--night:#2A1B5E;--plum:#8E3A8C;--sun:#F07A4A;--gold:#FFB547;--cream:#FFFBF8;--ink:#2A1B5E;--muted:#5E5770;--card:#FFFFFF;--line:#EEE7F6}
@media (prefers-color-scheme:dark){:root{--cream:#14101F;--ink:#F3EEFB;--muted:#B8B0C9;--card:#1E1830;--line:#2E2645}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Cairo,Tahoma,sans-serif;background:linear-gradient(160deg,var(--night) 0%,var(--plum) 60%,var(--sun) 100%);color:#fff;line-height:1.8;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:440px;background:var(--card);color:var(--ink);border-radius:28px;padding:32px 24px;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.logo{width:84px;height:84px;border-radius:22px;box-shadow:0 10px 26px rgba(42,27,94,.25)}
.from{margin:18px 0 0;font-size:15px;color:var(--muted)}
.from b{color:var(--ink)}
h1{font-size:26px;line-height:1.5;margin:6px 0 10px;font-weight:800}
.lead{color:var(--muted);margin:0 0 20px}
ul{list-style:none;padding:0;margin:0 0 24px;text-align:right}
li{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
li:last-child{border:0}
.play{display:inline-flex;align-items:center;gap:12px;background:#000;color:#fff;text-decoration:none;padding:12px 22px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.play svg{width:28px;height:28px}
.play small{display:block;font-size:11px;opacity:.8;line-height:1.2}
.play b{display:block;font-size:19px;line-height:1.3}
.free{margin-top:12px;font-size:13px;color:var(--muted)}
.more{display:block;margin-top:18px;font-size:14px;color:var(--plum);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="../img/icon-192.png" alt="إشراقة يومية">
  <p class="from" id="from" hidden><b id="name"></b> يدعوك</p>
  <h1>ابدأ يومك بإشراقة 🌅</h1>
  <p class="lead">تطبيق عربي هادئ يرافقك كل صباح.</p>
  <ul>
    <li>🌅 حكمة تُلهمك كل صباح مع شرحها</li>
    <li>📰 مقال يومي قصير يستحق القراءة</li>
    <li>📚 مكتبة وهدف قراءة لطيف</li>
    <li>🎓 منح دراسية حقيقية من مصادرها</li>
  </ul>
  <a class="play" id="play" href="https://play.google.com/store/apps/details?id=com.taeziz.ishraqa&referrer=utm_source%3Dinvite%26utm_medium%3Dapp" aria-label="احصل عليه من Google Play">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3.6 2.2 13.4 12l-9.8 9.8c-.4-.2-.6-.6-.6-1.1V3.3c0-.5.2-.9.6-1.1z"/><path fill="#FBBC04" d="m16.7 15.3-3.3-3.3 3.3-3.3 3.7 2.1c1.1.6 1.1 1.8 0 2.4z"/><path fill="#EA4335" d="M3.6 21.8 13.4 12l3.3 3.3L5 21.9c-.5.3-1 .2-1.4-.1z"/><path fill="#4285F4" d="M3.6 2.2c.4-.3.9-.4 1.4-.1l11.7 6.6L13.4 12z"/></svg>
    <span><small>احصل عليه من</small><b>Google Play</b></span>
  </a>
  <div class="free">مجاني بالكامل · بلا إعلانات</div>
  <a class="more" href="../">تعرّف على إشراقة ←</a>
</main>
<script>
  // اسم الداعي من الرابط (?n=) يُعرض نصًّا فقط
  try {
    var n = new URLSearchParams(location.search).get('n');
    if (n) {
      n = n.trim().slice(0, 40);
      if (n) {
        document.getElementById('name').textContent = n;
        document.getElementById('from').hidden = false;
        document.title = n + ' يدعوك إلى إشراقة يومية';
      }
    }
  } catch (e) {}
</script>
</body>
</html>
