<style>
:root{--night:#2A1B5E;--plum:#8E3A8C;--sun:#F07A4A;--gold:#FFB547;--cream:#FFFBF8;--ink:#2A1B5E;--muted:#5E5770;--card:#fff;--line:#EEE7F6}
@media (prefers-color-scheme:dark){:root{--cream:#14101F;--ink:#F3EEFB;--muted:#B8B0C9;--card:#1E1830;--line:#2E2645}}
*{box-sizing:border-box}body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--cream);color:var(--ink);line-height:1.9}
a{color:inherit}.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.top{background:linear-gradient(140deg,var(--night),var(--plum) 60%,var(--sun));color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;padding:14px 20px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none}.brand img{width:34px;height:34px;border-radius:9px}
.btn{display:inline-block;font-weight:700;text-decoration:none;border-radius:30px;padding:9px 18px}
.btn.light{background:rgba(255,255,255,.18);color:#fff;font-size:14px}
.btn.main{background:var(--sun);color:#fff;font-size:16px;padding:12px 26px}
.cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:0 0 26px 26px;display:block}
.cat{display:inline-block;margin-top:22px;padding:3px 14px;border-radius:20px;background:#F3EEFB;color:#4B2E83;font-weight:700;font-size:13px}
h1{font-size:32px;line-height:1.45;margin:12px 0}
.meta{color:var(--muted);font-size:14px;margin-bottom:18px}
article h2{font-size:23px;margin:28px 0 8px}article h3{font-size:19px}
article p,article li{font-size:18px}
article blockquote{margin:18px 0;padding:14px 18px;border-radius:14px;background:#FFE6DA;color:#5A2410}
.cta{margin:36px 0;padding:26px;border-radius:24px;background:linear-gradient(140deg,var(--night),var(--plum));color:#fff;text-align:center}
.cta p{margin:0 0 14px;font-size:17px}
.list a.item{display:flex;gap:14px;align-items:center;text-decoration:none;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.list img{width:120px;height:78px;object-fit:cover;border-radius:12px;flex-shrink:0}
.list b{display:block;line-height:1.5}.list small{color:var(--muted)}
.fade{position:relative}.fade:after{content:'';position:absolute;left:0;right:0;bottom:0;height:110px;background:linear-gradient(transparent,var(--cream))}
.src{font-size:13px;color:var(--muted);border-top:1px solid var(--line);margin-top:26px;padding-top:12px;white-space:pre-line}
footer{color:var(--muted);font-size:13px;text-align:center;padding:30px 0;line-height:2.2}
footer a{color:var(--muted);text-decoration:none} footer nav{margin-bottom:4px}
</style><meta name="robots" content="noindex, nofollow"><style>
main{padding-bottom:10px}main h2{font-size:24px;margin:34px 0 8px}main h3{font-size:19px;margin:20px 0 4px}
main p,main li{font-size:17px}.lead{font-size:19px;color:var(--muted)}
.hero{margin:26px 0 8px;padding:30px 24px;border-radius:26px;background:linear-gradient(140deg,var(--night),var(--plum) 62%,var(--sun));color:#fff}
.hero h1{margin:0 0 6px;font-size:30px}.hero p{margin:0;font-size:17px;opacity:.95}.hero small{color:#FFD27A;font-weight:700}
.card{padding:18px 20px;border-radius:20px;background:var(--card);border:1px solid var(--line);margin:12px 0}
.card h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.step{display:flex;gap:14px;align-items:flex-start;margin:12px 0}.step b.n{flex-shrink:0;width:34px;height:34px;border-radius:50%;
background:var(--sun);color:#fff;display:flex;align-items:center;justify-content:center}
.sw{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--card)}.sw div{height:86px}
.sw p{margin:0;padding:10px 12px;font-size:14px;line-height:1.6}.sw code{direction:ltr;unicode-bidi:embed;font-size:13px;color:var(--muted)}
.logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.logos figure{margin:0;padding:16px;border-radius:18px;border:1px solid var(--line);background:var(--card);text-align:center}
.logos img{width:96px;height:96px;object-fit:contain}.logos figcaption{font-size:14px;margin-top:6px}
.logos a{font-size:13px;font-weight:700;color:var(--plum)}
.shots{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x mandatory}.shots figure{scroll-snap-align:center}.shots img{height:330px;border-radius:18px;border:1px solid var(--line)}
.do{border-inline-start:4px solid #2E9E6A}.dont{border-inline-start:4px solid #D9534F}
.quote{padding:16px 18px;border-radius:16px;background:#FFE6DA;color:#5A2410;font-size:17px}
.dl{display:inline-block;margin:6px 0 6px 8px;padding:10px 20px;border-radius:30px;background:var(--sun);color:#fff;font-weight:700;text-decoration:none}
.dl.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.links a.item{display:block;text-decoration:none;padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.links small{display:block;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:16px}td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:700;white-space:nowrap;padding-inline-end:14px}
@media print{.top,.dl,footer{display:none}.hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
