name: Build article pages

on:
  schedule:
    - cron: '10 22 * * *'   # 00:10 بتوقيت الخرطوم: يظهر مقال اليوم الجديد
  workflow_dispatch:
  push:
    paths: ['tools/**', '.github/workflows/articles.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Africa/Khartoum
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install markdown
      - run: python tools/build_articles.py
      - name: Commit changes
        run: |
          git config user.name "ishraqa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A a sitemap.xml llms.txt tools/.lastmod.json
          git diff --cached --quiet || (git commit -m "Daily articles: $(date +%F)" && git push)
      # IndexNow بعد النشر لا قبله: ينتظر حتى تُنشر خريطة الموقع الجديدة على ishraqa.app
      - run: python tools/indexnow.py --wait
      - name: Save IndexNow state
        run: |
          git add tools/.indexnow_sent.json
          git diff --cached --quiet || (git commit -m "IndexNow state: $(date +%F)" && git push)
